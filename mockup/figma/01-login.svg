<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" data-name="01 · Login por rol"><defs><linearGradient id="flame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8590C"/><stop offset="1" stop-color="#E8590C"/></linearGradient><linearGradient id="electric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#475569"/></linearGradient><linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#475569"/></linearGradient><filter id="blur70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F7F8FA" opacity="1"/><rect x="72" y="64" width="48" height="48" rx="15.36" fill="#E8590C" opacity="1"/><path d="M96 73.6 C108 84.16 106.56 102.4 96 102.4 C85.44 102.4 84 90.4 92.16 83.2 C93.12 88 96 88.96000000000001 96 73.6Z" fill="#FFFFFF"/><text x="134" y="84" font-family="Sora, sans-serif" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.4">Surtigas S.A. E.S.P.</text><text x="134" y="104" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Prototipo · Proyecto de aula Fase 2 · Universidad de la Costa</text><text x="72" y="214" font-family="Sora, sans-serif" font-size="60" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-1.2">Anticipa la demanda.</text><text x="72" y="286" font-family="Sora, sans-serif" font-size="60" font-weight="600" letter-spacing="-1.3"><tspan fill="#E8590C">Redistribuye</tspan><tspan fill="#0F172A"> con datos.</tspan></text><text x="72" y="358" font-family="Sora, sans-serif" font-size="60" font-weight="600" letter-spacing="-1.3" fill="#64748B">Decide tú.</text><text x="72" y="410" font-family="Inter, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Optimización de turnos y recursos para 14 oficinas, calibrada con 22.611 turnos reales de</text><text x="72" y="436" font-family="Inter, sans-serif" font-size="17" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Digiturno (mayo 2026), con teoría de colas, simulación y aprobación humana obligatoria.</text><rect x="72" y="490" width="416" height="340" rx="26" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><rect x="98" y="516" width="56" height="56" rx="18" fill="#E8590C" opacity="1"/><text x="98" y="614" font-family="Sora, sans-serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.44">Encargado de turnos</text><text x="98" y="642" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Centro de decisión: disponibilidad, demanda</text><text x="98" y="662" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">prevista, alertas y recomendaciones del motor.</text><circle cx="104" cy="696" r="5" fill="#E8590C" opacity="1" /><text x="118" y="701" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Dashboard con semaforización</text><circle cx="104" cy="722" r="5" fill="#E8590C" opacity="1" /><text x="118" y="727" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Confirma ausencias (único autorizado)</text><circle cx="104" cy="748" r="5" fill="#E8590C" opacity="1" /><text x="118" y="753" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Aprueba o rechaza redistribuciones</text><text x="98" y="804" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#E8590C" text-anchor="start" opacity="1" letter-spacing="0">Entrar →</text><rect x="514" y="490" width="416" height="340" rx="26" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><rect x="540" y="516" width="56" height="56" rx="18" fill="#64748B" opacity="1"/><text x="540" y="614" font-family="Sora, sans-serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.44">Colaborador</text><text x="540" y="642" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Tu turno, tu oficina y el registro de asistencia</text><text x="540" y="662" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">desde tu puesto de trabajo.</text><circle cx="546" cy="696" r="5" fill="#475569" opacity="1" /><text x="560" y="701" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Registro de ingreso en un toque</text><circle cx="546" cy="722" r="5" fill="#475569" opacity="1" /><text x="560" y="727" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Responde la confirmación activa</text><circle cx="546" cy="748" r="5" fill="#475569" opacity="1" /><text x="560" y="753" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Canal de corrección de datos</text><text x="540" y="804" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start" opacity="1" letter-spacing="0">Entrar →</text><rect x="956" y="490" width="416" height="340" rx="26" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><rect x="982" y="516" width="56" height="56" rx="18" fill="#64748B" opacity="1"/><text x="982" y="614" font-family="Sora, sans-serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.44">Administrador</text><text x="982" y="642" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Usuarios, roles, parámetros del motor y</text><text x="982" y="662" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">gobernanza de datos previa al piloto.</text><circle cx="988" cy="696" r="5" fill="#475569" opacity="1" /><text x="1002" y="701" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Parámetros del modelo de colas</text><circle cx="988" cy="722" r="5" fill="#475569" opacity="1" /><text x="1002" y="727" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Control de acceso por rol</text><circle cx="988" cy="748" r="5" fill="#475569" opacity="1" /><text x="1002" y="753" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Checklist Ley 1581 de 2012</text><text x="982" y="804" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start" opacity="1" letter-spacing="0">Entrar →</text></svg>