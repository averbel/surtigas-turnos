<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" data-name="03 · Verificación en 4 niveles"><defs><linearGradient id="flame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8590C"/><stop offset="1" stop-color="#E8590C"/></linearGradient><linearGradient id="electric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#475569"/></linearGradient><linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#475569"/></linearGradient><filter id="blur70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter></defs><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F7F8FA" opacity="1"/><rect x="0" y="0" width="252" height="760" rx="0" fill="#FFFFFF" opacity="1"/><rect x="252" y="0" width="1" height="760" rx="0" fill="#E5E7EB" opacity="1"/><rect x="26" y="26" width="40" height="40" rx="12.8" fill="#E8590C" opacity="1"/><path d="M46 34 C56 42.8 54.8 58 46 58 C37.2 58 36 48 42.8 42 C43.6 46 46 46.8 46 34Z" fill="#FFFFFF"/><text x="78" y="44" font-family="Sora, sans-serif" font-size="17" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.34">Surtigas</text><text x="78" y="60" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Centro de decisión de turnos</text><circle cx="40" cy="117" r="7" fill="none" opacity="1" stroke="#64748B" stroke-width="2"/><text x="60" y="122" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Centro de decisión</text><rect x="16" y="144" width="220" height="42" rx="12" fill="#E8590C" opacity="0.18"/><rect x="16" y="144" width="220" height="42" rx="12" fill="none" opacity="1" stroke="#E8590C" stroke-width="1" stroke-opacity="0.4"/><circle cx="40" cy="165" r="7" fill="none" opacity="1" stroke="#0F172A" stroke-width="2"/><text x="60" y="170" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Verificación</text><circle cx="40" cy="213" r="7" fill="none" opacity="1" stroke="#64748B" stroke-width="2"/><text x="60" y="218" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Recomendaciones</text><circle cx="40" cy="261" r="7" fill="none" opacity="1" stroke="#64748B" stroke-width="2"/><text x="60" y="266" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Histórico</text><circle cx="40" cy="309" r="7" fill="none" opacity="1" stroke="#64748B" stroke-width="2"/><text x="60" y="314" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Trazabilidad</text><rect x="16" y="650" width="220" height="84" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><text x="32" y="680" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Apoyo a la decisión</text><text x="32" y="698" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">El sistema recomienda. La</text><text x="32" y="713" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">decisión final siempre es humana.</text><text x="282" y="44" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.5">PROCESO DE 4 NIVELES</text><text x="282" y="80" font-family="Sora, sans-serif" font-size="28" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.56">Verificación de asistencia</text><rect x="1060" y="30" width="120" height="46" rx="14" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><circle cx="1082" cy="53" r="4" fill="#16A34A" opacity="1" /><text x="1096" y="59" font-family="Sora, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.3">13:15</text><rect x="1196" y="30" width="214" height="46" rx="23" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><circle cx="1221" cy="53" r="16" fill="#64748B" opacity="1" /><text x="1221" y="57" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="0">MR</text><text x="1246" y="50" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Marta Ríos</text><text x="1246" y="65" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Encargada de turnos</text><rect x="282" y="108" width="1128" height="210" rx="18" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><rect x="282" y="108" width="1128" height="210" rx="18" fill="none" opacity="1" stroke="#E8590C" stroke-width="1.5" stroke-opacity="0.9"/><circle cx="329" cy="156" r="23" fill="#64748B" opacity="1" /><text x="329" y="161" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="0">LM</text><text x="364" y="150" font-family="Sora, sans-serif" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.4">Laura Mendoza</text><text x="364" y="170" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Turbaco · jornada completa</text><rect x="1196" y="142" width="168.6" height="24" rx="12" fill="#DC2626" opacity="0.14"/><rect x="1196" y="142" width="168.6" height="24" rx="12" fill="none" opacity="1" stroke="#DC2626" stroke-width="1" stroke-opacity="0.4"/><circle cx="1209" cy="154" r="3.5" fill="#DC2626" opacity="1" /><text x="1220" y="158" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1" letter-spacing="0">Escalado al encargado</text><rect x="457" y="234.5" width="214" height="3" rx="2" fill="#E8590C" opacity="1"/><circle cx="423" cy="236" r="27" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/><path d="M415 236 l6 6 l11 -12" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="423" y="286" font-family="Sora, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="-0.26">Nivel 0 · Malla</text><text x="423" y="304" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle" opacity="1" letter-spacing="0">Sincronización con la malla aprobada</text><rect x="739" y="234.5" width="214" height="3" rx="2" fill="#E8590C" opacity="1"/><circle cx="705" cy="236" r="27" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/><path d="M697 236 l6 6 l11 -12" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="705" y="286" font-family="Sora, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="-0.26">Nivel 1 · «No registrado»</text><text x="705" y="304" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle" opacity="1" letter-spacing="0">Etiqueta neutra, sin declarar ausencia</text><rect x="1021" y="234.5" width="214" height="3" rx="2" fill="#E8590C" opacity="1"/><circle cx="987" cy="236" r="27" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/><path d="M979 236 l6 6 l11 -12" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="987" y="286" font-family="Sora, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="-0.26">Nivel 2 · Colaborador</text><text x="987" y="304" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle" opacity="1" letter-spacing="0">Confirmación activa a la persona</text><circle cx="1269" cy="236" r="27" fill="#E8590C" opacity="0.12" stroke="#E8590C" stroke-width="2"/><circle cx="1269" cy="236" r="6" fill="#E8590C" opacity="1" /><text x="1269" y="286" font-family="Sora, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="-0.26">Nivel 3 · Encargado</text><text x="1269" y="304" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle" opacity="1" letter-spacing="0">Solo el encargado confirma la ausencia</text><rect x="282" y="342" width="556" height="220" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><text x="304" y="378" font-family="Sora, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.36">¿Qué está pasando?</text><text x="304" y="410" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Sin respuesta del colaborador. Solo tú puedes confirmar una</text><text x="304" y="432" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">ausencia o indicar que fue un cambio autorizado.</text><rect x="304" y="470" width="196" height="46" rx="14" fill="#E8590C" opacity="1"/><text x="402" y="498" font-family="Inter, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">Confirmar ausencia</text><rect x="512" y="470" width="240" height="46" rx="14" fill="#0F172A" opacity="0.09"/><rect x="512" y="470" width="240" height="46" rx="14" fill="none" opacity="1" stroke="#0F172A" stroke-width="1" stroke-opacity="0.1"/><text x="632" y="498" font-family="Inter, sans-serif" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="0">Era un cambio autorizado</text><rect x="856" y="342" width="554" height="220" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><text x="878" y="378" font-family="Sora, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.36">Principios de esta pantalla</text><circle cx="884" cy="405" r="3" fill="#64748B" opacity="1" /><text x="898" y="410" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Lenguaje neutro: «no registrado», nunca «ausente».</text><circle cx="884" cy="431" r="3" fill="#64748B" opacity="1" /><text x="898" y="436" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">El sistema jamás declara una ausencia por sí solo.</text><circle cx="884" cy="457" r="3" fill="#64748B" opacity="1" /><text x="898" y="462" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">La disponibilidad no se usa para evaluar desempeño individual.</text><circle cx="884" cy="483" r="3" fill="#64748B" opacity="1" /><text x="898" y="488" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Cada paso queda registrado en la trazabilidad.</text></svg>