r="start" opacity="1" letter-spacing="-0.56">Recomendaciones del motor</text><rect x="1060" y="30" width="120" height="46" rx="14" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><circle cx="1082" cy="53" r="4" fill="#16A34A" opacity="1" /><text x="1096" y="59" font-family="Sora, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.3">13:15</text><rect x="1196" y="30" width="214" height="46" rx="23" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><circle cx="1221" cy="53" r="16" fill="#64748B" opacity="1" /><text x="1221" y="57" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" opacity="1" letter-spacing="0">MR</text><text x="1246" y="50" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Marta Ríos</text><text x="1246" y="65" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Encargada de turnos</text><rect x="282" y="108" width="1128" height="196" rx="18" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><rect x="282" y="108" width="1128" height="196" rx="18" fill="none" opacity="1" stroke="#E8590C" stroke-width="1.5" stroke-opacity="0.9"/><rect x="308" y="132" width="56" height="56" rx="18" fill="#E8590C" opacity="1"/><text x="384" y="144" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="1.4">RECOMENDACIÓN DEL MOTOR · 13:15</text><text x="384" y="176" font-family="Sora, sans-serif" font-size="22" font-weight="700" letter-spacing="-.4" fill="#0F172A">Se recomienda trasladar temporalmente un colaborador de <tspan fill="#E8590C">Cartagena</tspan></text><text x="384" y="204" font-family="Sora, sans-serif" font-size="22" font-weight="700" letter-spacing="-.4" fill="#0F172A">a <tspan fill="#E8590C">Turbaco</tspan> durante el periodo de mayor demanda.</text><rect x="308" y="224" width="348" height="64" rx="14" fill="#0F172A" opacity="0.05"/><rect x="308" y="224" width="348" height="64" rx="14" fill="none" opacity="1" stroke="#0F172A" stroke-width="1" stroke-opacity="0.1"/><text x="322" y="244" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Capacidad insuficiente</text><text x="322" y="260" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Turbaco quedó con 1 colaborador tras la ausencia</text><text x="322" y="274" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">confirmada. Capacidad ≈ 5/h frente a 6/h previstas.</text><rect x="672" y="224" width="348" height="64" rx="14" fill="#0F172A" opacity="0.05"/><rect x="672" y="224" width="348" height="64" rx="14" fill="none" opacity="1" stroke="#0F172A" stroke-width="1" stroke-opacity="0.1"/><text x="686" y="244" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Pico próximo</text><text x="686" y="260" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">La demanda alcanza su máximo hacia las 13:15. Sin</text><text x="686" y="274" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">cambios, la espera estimada llega a 110 min.</text><rect x="1036" y="224" width="348" height="64" rx="14" fill="#0F172A" opacity="0.05"/><rect x="1036" y="224" width="348" height="64" rx="14" fill="none" opacity="1" stroke="#0F172A" stroke-width="1" stroke-opacity="0.1"/><text x="1050" y="244" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Donante viable</text><text x="1050" y="260" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Cartagena está a 18 km y su espera subiría solo de &lt;1 a</text><text x="1050" y="274" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">1 min.</text><rect x="282" y="328" width="556" height="520" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><text x="304" y="364" font-family="Sora, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.36">Simulación de escenarios</text><rect x="304" y="392" width="512" height="128" rx="16" fill="#0F172A" opacity="0.05"/><rect x="304" y="392" width="512" height="128" rx="16" fill="none" opacity="1" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/><text x="326" y="432" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Sin cambios</text><text x="326" y="452" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Se mantiene la capacidad actual.</text><text x="786" y="462" font-family="Sora, sans-serif" font-size="40" font-weight="600" fill="#DC2626" text-anchor="end" opacity="1" letter-spacing="-0.8">110</text><text x="792" y="462" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">min</text><text x="792" y="492" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end" opacity="1" letter-spacing="0">ρ 76% · fila ≈ 11</text><rect x="304" y="540" width="512" height="128" rx="16" fill="#E8590C" opacity="0.12"/><rect x="304" y="540" width="512" height="128" rx="16" fill="none" opacity="1" stroke="#E8590C" stroke-width="1" stroke-opacity="0.9"/><rect x="690" y="528" width="108" height="24" rx="12" fill="#E8590C" opacity="1"/><text x="744" y="544" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">Recomendado</text><text x="326" y="580" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Traslado temporal desde Cartagena</text><text x="326" y="600" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">18 km · atención presencial</text><text x="786" y="610" font-family="Sora, sans-serif" font-size="40" font-weight="600" fill="#16A34A" text-anchor="end" opacity="1" letter-spacing="-0.8">4</text><text x="792" y="610" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">min</text><text x="792" y="640" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end" opacity="1" letter-spacing="0">ρ 56% · fila ≈ 0</text><rect x="304" y="688" width="512" height="128" rx="16" fill="#0F172A" opacity="0.05"/><rect x="304" y="688" width="512" height="128" rx="16" fill="none" opacity="1" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/><text x="326" y="728" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Apoyo virtual desde Cartagena</text><text x="326" y="748" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Atiende de forma remota ~60 % de un</text><text x="326" y="763" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">colaborador</text><text x="786" y="758" font-family="Sora, sans-serif" font-size="40" font-weight="600" fill="#D97706" text-anchor="end" opacity="1" letter-spacing="-0.8">23</text><text x="792" y="758" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">min</text><text x="792" y="788" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end" opacity="1" letter-spacing="0">ρ 70% · fila ≈ 2</text><rect x="856" y="328" width="554" height="262" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><text x="878" y="364" font-family="Sora, sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.36">Espera esperada en el pico</text><text x="878" y="396" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Sin cambios</text><text x="1388" y="396" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#DC2626" text-anchor="end" opacity="1" letter-spacing="0">110 min</text><rect x="878" y="406" width="510" height="10" rx="5" fill="#0F172A" opacity="0.08"/><rect x="878" y="406" width="468.72025119355897" height="10" rx="5" fill="#DC2626" opacity="1"/><text x="878" y="458" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Traslado temporal desde Cartagena</text><text x="1388" y="458" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#16A34A" text-anchor="end" opacity="1" letter-spacing="0">4 min</text><rect x="878" y="468" width="510" height="10" rx="5" fill="#0F172A" opacity="0.08"/><rect x="878" y="468" width="17.383749578079414" height="10" rx="5" fill="#16A34A" opacity="1"/><text x="878" y="520" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Apoyo virtual desde Cartagena</text><text x="1388" y="520" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="end" opacity="1" letter-spacing="0">23 min</text><rect x="878" y="530" width="510" height="10" rx="5" fill="#0F172A" opacity="0.08"/><rect x="878" y="530" width="96.37281999377137" height="10" rx="5" fill="#D97706" opacity="1"/><rect x="856" y="610" width="554" height="238" rx="16" fill="#FFFFFF" opacity="1" stroke="#E5E7EB" stroke-width="1" stroke-opacity="1"/><rect x="878" y="634" width="340" height="52" rx="14" fill="#16A34A" opacity="1"/><text x="1048" y="666" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">Aprobar y aplicar</text><rect x="1230" y="634" width="158" height="52" rx="14" fill="#DC2626" opacity="0.1"/><rect x="1230" y="634" width="158" height="52" rx="14" fill="none" opacity="1" stroke="#DC2626" stroke-width="1" stroke-opacity="0.4"/><text x="1309" y="666" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC2626" text-anchor="middle" opacity="1" letter-spacing="0">Rechazar</text><text x="878" y="722" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">La decisión final corresponde siempre al responsable autorizado.</text><rect x="878" y="742" width="510" height="78" rx="14" fill="#16A34A" opacity="0.08"/><rect x="878" y="742" width="510" height="78" rx="14" fill="none" opacity="1" stroke="#16A34A" stroke-width="1" stroke-opacity="0.3"/><text x="896" y="768" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Tras aprobar: monitoreo continuo activo. Si cambian demanda o</text><text x="896" y="788" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">disponibilidad, el sistema genera una nueva alerta.</text></svg>