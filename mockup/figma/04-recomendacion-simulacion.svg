<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" data-name="04 · Recomendación y simulación"><defs><linearGradient id="flame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8590C"/><stop offset="1" stop-color="#E8590C"/></linearGradient><linearGradient id="electric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#475569"/></linearGradient><linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#475569"/></linearGradient><filter id="blur70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F7F8FA" opacity="1"/><rect x="0" y="0" width="252" height="900" rx="0" fill="#FFFFFF" opacity="1"/><rect x="252" y="0" width="1" height="900" rx="0" fill="#E5E7EB" opacity="1"/><rect x="26" y="26" width="40" height="40" rx="12.8" fill="#E8590C" opacity="1"/><path d="M46 34 C56 42.8 54.8 58 46 58 C37.2 58 36 48 42.8 42 C43.6 46 46 46.8 46 34Z" fill="#FFFFFF"/><text x="78" y="44" font-family="Sora, sans-serif" font-size="17" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="-0.34">Surtigas</text><text x="78" y="60" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Centro de decisión de turnos</text><circle cx="40" cy="117" r="7" fill="none" opacity="1" stroke="#64748B" stroke-width="2"/><text x="60" y="122" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Centro de decisión</text><circle cx="40" cy="165" r="7" fill="none" opacity="1" stroke="#64748B" stroke-width="2"/><text x="60" y="170" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" opacity="1" letter-spacing="0">Verifi