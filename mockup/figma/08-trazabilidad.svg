s-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start" opacity="1" letter-spacing="0.7">13:15 · MOTOR</text><text x="336" y="238" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">La capacidad cae por debajo de la demanda prevista. Se simularon alternativas de</text><text x="336" y="256" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">redistribución.</text><circle cx="313" cy="294" r="7" fill="#FFFFFF" opacity="1" stroke="#D97706" stroke-width="3"/><text x="336" y="290" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start" opacity="1" letter-spacing="0.7">13:15 · ENCARGADA</text><text x="336" y="310" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Confirmó manualmente la ausencia de Laura Mendoza (Nivel 3).</text><circle cx="313" cy="366" r="7" fill="#FFFFFF" opacity="1" stroke="#D97706" stroke-width="3"/><text x="336" y="362" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start" opacity="1" letter-spacing="0.7">13:10 · SISTEMA</text><text x="336" y="382" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Nivel 3 · Sin respuesta. Caso escalado al encargado para decisión manual.</text><circle cx="313" cy="438" r="7" fill="#FFFFFF" opacity="1" stroke="#475569" stroke-width="3"/><text x="336" y="434" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start" opacity="1" letter-spacing="0.7">13:07 · SISTEMA</text><text x="336" y="454" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Nivel 2 · Sin reasignación autorizada en la malla. Se solicita confirmación activa.</text><circle cx="313" cy="510" r="7" fill="#FFFFFF" opacity="1" stroke="#D97706" stroke-width="3"/><text x="336" y="506" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start" opacity="1" letter-spacing="0.7">13:05 · SISTEMA</text><text x="336" y="526" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Nivel 1 · Laura Mendoza aparece como «no registrado» en Turbaco. No se declara ausencia.</text><circle cx="313" cy="582" r="7" fill="#FFFFFF" opacity="1" stroke="#475569" stroke-width="3"/><text x="336" y="578" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start" opacity="1" letter-spacing="0.7">13:00 · SISTEMA</text><text x="336" y="598" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#0F172A" text-anchor="start" opacity="1" letter-spacing="0">Malla de turnos aprobada sincronizada (Nivel 0).</text></svg>